<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments :: head('My account')}"></head>
<body class="bg-light">
<nav th:replace="~{staff/fragments :: navbar('account')}"></nav>
<div th:replace="~{staff/fragments :: alerts}"></div>

<div class="container my-4" style="max-width: 640px;">
    <h2 class="fw-bold mb-3"><i class="bi bi-person-gear me-2"></i>My account</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white"><h5 class="mb-0">Details</h5></div>
        <div class="card-body">
            <form th:action="@{/staff/account}" method="post">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <div class="mb-3">
                    <label class="form-label" for="fullName">Full name</label>
                    <input id="fullName" type="text" name="fullName" class="form-control" maxlength="200" required th:value="${staffUser.fullName}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" type="email" name="email" class="form-control" required th:value="${staffUser.email}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-control" th:value="${staffUser.role}" disabled>
                </div>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white"><h5 class="mb-0">Change password</h5></div>
        <div class="card-body">
            <form th:action="@{/staff/account/password}" method="post">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <div class="mb-3">
                    <label class="form-label" for="currentPassword">Current password</label>
                    <input id="currentPassword" type="password" name="currentPassword" class="form-control" required autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">New password</label>
                    <input id="newPassword" type="password" name="newPassword" class="form-control" minlength="8" maxlength="100" required autocomplete="new-password">
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" type="password" name="confirmPassword" class="form-control" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Change password</button>
            </form>
        </div>
    </div>
</div>

<script th:replace="~{staff/fragments :: scripts}"></script>
</body>
</html>
