<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments :: head('Staff sign up')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 440px;">
    <div class="card shadow-sm mt-5 mb-4">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Create staff account</h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/staff/signup}" method="post">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <div class="mb-3">
                    <label class="form-label" for="fullName">Full name</label>
                    <input id="fullName" type="text" name="fullName" th:value="${fullName}" maxlength="200" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" type="email" name="email" th:value="${email}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password <small class="text-muted">(8+ characters)</small></label>
                    <input id="password" type="password" name="password" minlength="8" maxlength="100" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" type="password" name="confirmPassword" minlength="8" maxlength="100" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="role">Role</label>
                    <select id="role" name="role" class="form-select">
                        <option value="STAFF" th:selected="${role == null or role == 'STAFF'}">Staff</option>
                        <option value="ADMIN" th:selected="${role == 'ADMIN'}">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-dark w-100">Create account</button>
            </form>
            <div class="text-center mt-3 small"><a th:href="@{/staff/login}">Back to log in</a></div>
        </div>
    </div>
</div>
</body>
</html>
