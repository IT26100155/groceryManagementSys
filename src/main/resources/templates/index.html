<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Grocery App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 8px 12px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; }
        .btn-update { color: #007bff; text-decoration: none; margin-right: 10px; }
        .btn-delete { color: #dc3545; text-decoration: none; }
    </style>
</head>
<body>

<h1>Grocery Inventory</h1>

<a th:href="@{/showNewItemForm}" class="btn">+ Add New Item</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Item Name</th>
        <th>Price ($)</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${listItems}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.name}">Apple</td>
        <td th:text="${item.price}">1.50</td>
        <td th:text="${item.quantity}">10</td>
        <td>
            <a th:href="@{/showFormForUpdate/{id}(id=${item.id})}" class="btn-update">Edit</a>
            <a th:href="@{/deleteItem/{id}(id=${item.id})}" class="btn-delete"
               onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
