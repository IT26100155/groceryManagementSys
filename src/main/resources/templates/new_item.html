<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Grocery Item</title>
    <!-- Simple CSS Styling -->
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        a { display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<h2>Add New Grocery Item</h2>

<form th:action="@{/saveItem}" th:object="${item}" method="POST">
    <div class="form-group">
        <label for="name">Item Name:</label>
        <input type="text" id="name" th:field="*{name}" placeholder="e.g. Organic Apples" required/>
    </div>

    <div class="form-group">
        <label for="price">Price ($):</label>
        <input type="number" id="price" step="0.01" th:field="*{price}" placeholder="e.g. 2.99" required/>
    </div>

    <div class="form-group">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" th:field="*{quantity}" placeholder="e.g. 50" required/>
    </div>

    <button type="submit">Save Item</button>
</form>

<br/>
<a th:href="@{/}">← Back to Grocery List</a>

</body>
</html>
