<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments :: head('Stock log')}"></head>
<body class="bg-light">
<nav th:replace="~{staff/fragments :: navbar('logs')}"></nav>
<div th:replace="~{staff/fragments :: alerts}"></div>

<div class="container my-4">
    <h2 class="fw-bold mb-4">Inventory Update Audit Log</h2>
    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-striped align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Log ID</th>
                <th>Date &amp; Time</th>
                <th>Item Name</th>
                <th>Employee</th>
                <th>Quantity Change</th>
                <th>Reason</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.id}"></td>
                <td th:text="${#temporals.format(log.date, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${log.itemName}"></td>
                <td th:text="${log.employeeId == staffUser.id ? 'You (#' + log.employeeId + ')' : '#' + log.employeeId}"></td>
                <td>
                    <span th:class="${log.amount > 0 ? 'text-success fw-bold' : 'text-danger fw-bold'}"
                          th:text="${log.amount > 0 ? '+' + log.amount : log.amount}">
                    </span>
                </td>
                <td>
                    <span class="badge bg-secondary" th:text="${log.reason}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="6" class="text-center py-4 text-muted">No inventory updates logged yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:replace="~{staff/fragments :: scripts}"></script>
</body>
</html>
