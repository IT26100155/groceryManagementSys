<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments :: head('Inventory')}"></head>
<body class="bg-light">
<nav th:replace="~{staff/fragments :: navbar('inventory')}"></nav>
<div th:replace="~{staff/fragments :: alerts}"></div>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-box-seam me-2"></i>Grocery Inventory</h2>
        <div>
            <a th:if="${staffUser.admin}" th:href="@{/staff/inventory/add-perishable}" class="btn btn-primary me-1">+ Add Perishable Item</a>
            <a th:if="${staffUser.admin}" th:href="@{/staff/inventory/add-non-perishable}" class="btn btn-outline-primary me-1">+ Add Non-Perishable Item</a>
            <a th:href="@{/staff/inventory/categories}" class="btn btn-outline-secondary me-1"><i class="bi bi-tags me-1"></i>Categories</a>
            <a th:href="@{/staff/inventory/export-csv}" class="btn btn-success"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</a>
        </div>
    </div>

    <form th:action="@{/staff/inventory/items}" method="get" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by item name...">
        </div>
        <div class="col-md-4">
            <select name="categoryId" class="form-select">
                <option value="">All Categories</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${cat.id == selectedCategory}">
                </option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-dark w-100">Search / Filter</button>
        </div>
    </form>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Categories</th>
                <th>Storage Type</th>
                <th>Price</th>
                <th>Stock</th>
                <th style="min-width: 300px;">Quick Stock Update</th>
                <th th:if="${staffUser.admin}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td>
                    <img th:src="${item.imageUrl != null && !item.imageUrl.empty ? item.imageUrl : 'https://via.placeholder.com/60'}"
                         alt="Item" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                </td>
                <td>
                    <strong th:text="${item.name}"></strong><br>
                    <small class="text-muted" th:text="${item.brandSupplier}"></small>
                </td>
                <td>
                    <span th:each="catName : ${item.categoryNames}" class="badge bg-light text-dark border me-1" th:text="${catName}"></span>
                    <span th:if="${#lists.isEmpty(item.categoryNames)}" class="text-muted small">&mdash;</span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${item.itemType == 'PERISHABLE' ? 'bg-info text-dark' : 'bg-secondary'}"
                          th:text="${item.storageType}">
                    </span>
                </td>
                <td th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${item.availableStock < 15 ? 'bg-danger' : 'bg-success'}"
                          th:text="${item.availableStock}">
                    </span>
                </td>
                <td>
                    <form th:action="@{/staff/inventory/quick-update}" method="post" class="d-flex align-items-center gap-1">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <select name="updateType" class="form-select form-select-sm" style="width: 70px;">
                            <option value="Increase">+</option>
                            <option value="Decrease">-</option>
                        </select>
                        <input type="number" name="amount" class="form-control form-control-sm" placeholder="Qty" min="1" required style="width: 70px;">
                        <select name="reason" class="form-select form-select-sm" style="width: 110px;">
                            <option value="restock">Restock</option>
                            <option value="sale">Sale</option>
                            <option value="return">Return</option>
                            <option value="correction">Correction</option>
                        </select>
                        <button type="submit" class="btn btn-outline-primary btn-sm">Update</button>
                    </form>
                </td>
                <td th:if="${staffUser.admin}" class="text-nowrap">
                    <a th:href="@{/staff/inventory/items/{id}/categories(id=${item.id})}" class="btn btn-outline-secondary btn-sm">Edit categories</a>
                    <a th:href="@{/staff/inventory/items/{id}/image(id=${item.id})}" class="btn btn-outline-secondary btn-sm">Change picture</a>
                    <form th:action="@{/staff/inventory/delete/{id}(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this item?');">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="8" class="text-center py-4 text-muted">No items found in inventory.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:replace="~{staff/fragments :: scripts}"></script>
</body>
</html>
