<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Grocery Item</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0069d9; }
        a { display: inline-block; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>

<h2>Update Grocery Item</h2>

<form th:action="@{/saveItem}" th:object="${item}" method="POST">
    <!-- Hidden input to keep track of the Item ID -->
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="name">Item Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
    </div>

    <div class="form-group">
        <label for="price">Price ($):</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" required/>
    </div>

    <div class="form-group">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" th:field="*{quantity}" required/>
    </div>

    <button type="submit">Update Item</button>
</form>

<br/>
<a th:href="@{/}">← Back to Grocery List</a>

</body>
</html>
