<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<link rel="stylesheet" href="../auth.css">
<script>if (localStorage.getItem("gms_customer")) location.replace("customer.html");</script>
</head>
<body>
<input id="base" type="hidden">
<div class="split">
  <div class="left"><img src="../login-image.svg" alt=""></div>
  <div class="right">
    <form class="card" onsubmit="return doSignup(event)">
      <h1>Create your account</h1>
      <p class="sub">It only takes a minute.</p>
      <label for="name">Full name</label>
      <input id="name" required>
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="phone">Phone number</label>
      <input id="phone" required>
      <label for="pass">Password (at least 8 characters)</label>
      <input id="pass" type="password" minlength="8" required>
      <div class="error" id="err"></div>
      <button type="submit">Sign up</button>
      <div class="alt">Already have an account? <a href="../index.html">Log in</a></div>
    </form>
  </div>
</div>
<script src="../common.js"></script>
<script>
async function doSignup(e) {
  e.preventDefault();
  $('err').textContent = '';
  const r = await authPost('/api/customers/signup', {
    fullName: v('name'), email: v('email'), password: $('pass').value, phoneNumber: v('phone')
  });
  if (r.ok && r.data && r.data.id) {
    localStorage.setItem('gms_customer', JSON.stringify(r.data));
    location.replace('customer.html');
  } else {
    $('err').textContent = errorMessage(r);
  }
  return false;
}
</script>
</body>
</html>
