<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account</title>
<link rel="stylesheet" href="../store.css">
<script>if (!localStorage.getItem("gms_customer")) location.replace("../index.html");</script>
</head>
<body>
<input id="base" type="hidden">
<div id="nav"></div>
<div id="msg" class="msg"></div>

<div class="page">
  <p><a href="customer.html">&larr; Back to the store</a></p>

  <div class="panel">
    <h2>My account</h2>
    <div id="profile"></div>
  </div>

  <div class="panel">
    <h2>Addresses</h2>
    <input id="ad_body" placeholder="address" size="40">
    <button type="button" onclick="addAddress()">Add address</button>
    <br>
    <select id="ad_id"></select>
    <button type="button" onclick="updateAddress()">Update selected (with the text above)</button>
    <button type="button" onclick="deleteAddress()">Delete selected</button>
  </div>

  <div class="panel">
    <h2>My orders</h2>
    <div id="orders_table"></div>
  </div>
</div>

<script src="../common.js"></script>
<script src="../nav.js"></script>
<script>
async function loadProfile() {
  const p = $('profile');
  p.innerHTML = '';
  for (const [label, value] of [['Name', me.fullName], ['Email', me.email], ['Phone', me.phoneNumber]]) {
    if (!value) continue;
    const d = document.createElement('div');
    d.textContent = label + ': ' + value;
    p.appendChild(d);
  }
}

async function loadAddresses() {
  const a = await getJson(cust('/addresses'));
  fillSelect('ad_id', a, x => x.addressBody, '(no saved addresses)');
}

async function loadOrders() {
  const box = $('orders_table');
  box.innerHTML = '';
  const [orders, items] = await Promise.all([getJson('/api/orders/customers/' + me.id), getJson('/api/items')]);
  if (!orders.length) { box.textContent = 'No orders yet.'; return; }
  const names = Object.fromEntries(items.map(i => [i.id, i.name]));
  const t = makeTable(['Order', 'Date', 'Status', 'Items', 'Total']);
  t.border = 0;
  for (const o of orders) {
    const lines = (o.items || []).map(u => (names[u.itemId] || 'Item ' + u.itemId) + ' x ' + u.quantity + ' @ ' + u.unitPrice).join('; ');
    addRow(t.insertRow(), ['#' + o.id, o.date ? String(o.date).replace('T', ' ').slice(0, 16) : '', o.status, lines, o.total]);
  }
  box.appendChild(t);
}

async function act(method, path, body, okText) {
  const r = await send(method, path, body);
  if (r.ok) { notify(okText, false); await refreshAll(); }
  else notify(errorMessage(r), true);
}
function addAddress() {
  if (!v('ad_body')) { notify('Type an address first.', true); return; }
  act('POST', cust('/addresses'), { addressBody: v('ad_body') }, 'Address added.');
}
function updateAddress() {
  if (!v('ad_id')) { notify('Choose an address first.', true); return; }
  act('PUT', cust('/addresses/' + v('ad_id')), { addressBody: v('ad_body') }, 'Address updated.');
}
function deleteAddress() {
  if (!v('ad_id')) { notify('Choose an address first.', true); return; }
  act('DELETE', cust('/addresses/' + v('ad_id')), undefined, 'Address deleted.');
}

async function refreshAll() {
  await Promise.all([loadProfile(), loadAddresses(), loadOrders()]);
}
$('base').onchange = refreshAll;
refreshAll();
</script>
</body>
</html>
