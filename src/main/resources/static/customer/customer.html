<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocery Store</title>
<link rel="stylesheet" href="../store.css">
<script>if (!localStorage.getItem("gms_customer")) location.replace("../index.html");</script>
</head>
<body>
<input id="base" type="hidden">
<div id="nav"></div>

<div class="searchbar">
  <input id="q" type="search" placeholder="Search items by name" oninput="applyFilters()">
  <button type="button" onclick="applyFilters()">Search</button>
</div>
<div id="msg" class="msg"></div>

<div class="store">
  <aside class="filters">
    <h3>Filters</h3>
    <h4>Categories</h4>
    <div id="f_cats"></div>
    <h4>Price</h4>
    <input id="f_min" type="number" min="0" step="any" placeholder="Min" oninput="applyFilters()">
    &ndash;
    <input id="f_max" type="number" min="0" step="any" placeholder="Max" oninput="applyFilters()">
    <h4>Availability</h4>
    <label><input id="f_stock" type="checkbox" onchange="applyFilters()"> In stock only</label>
    <button type="button" onclick="clearFilters()">Clear filters</button>
  </aside>
  <main class="results">
    <p class="count" id="count"></p>
    <div id="grid" class="grid"></div>
  </main>
</div>

<script src="../common.js"></script>
<script src="../nav.js"></script>
<script>
let items = [];
let cats = [];

const effectivePrice = i => Number(i.discountedPrice != null ? i.discountedPrice : i.price);

async function load() {
  [items, cats] = await Promise.all([getJson('/api/items'), getJson('/api/categories')]);
  const box = $('f_cats');
  box.innerHTML = '';
  if (!cats.length) box.textContent = '(none)';
  for (const c of cats) {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = c.id;
    cb.onchange = applyFilters;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + c.name));
    box.appendChild(label);
  }
  applyFilters();
}

function applyFilters() {
  const q = v('q').toLowerCase();
  const selCats = checked('f_cats');
  const min = v('f_min') === '' ? null : Number(v('f_min'));
  const max = v('f_max') === '' ? null : Number(v('f_max'));
  const inStock = $('f_stock').checked;

  const shown = items.filter(i => {
    if (q && !i.name.toLowerCase().includes(q)) return false;
    if (selCats.length && !(i.categoryIds || []).some(id => selCats.includes(id))) return false;
    const p = effectivePrice(i);
    if (min !== null && p < min) return false;
    if (max !== null && p > max) return false;
    if (inStock && !(i.availableStock > 0)) return false;
    return true;
  });
  render(shown);
}

function clearFilters() {
  $('q').value = '';
  $('f_min').value = '';
  $('f_max').value = '';
  $('f_stock').checked = false;
  $('f_cats').querySelectorAll('input').forEach(c => c.checked = false);
  applyFilters();
}

function render(list) {
  $('count').textContent = list.length + ' of ' + items.length + ' items';
  const grid = $('grid');
  grid.innerHTML = '';
  if (!list.length) { grid.textContent = 'No items match your search.'; return; }
  for (const i of list) grid.appendChild(card(i));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function card(i) {
  const out = !(i.availableStock > 0);
  const c = el('div', 'card' + (out ? ' out' : ''));
  c.appendChild(el('div', 'name', i.name));
  if (i.brand) c.appendChild(el('div', 'brand', i.brand));
  c.appendChild(el('div', 'desc', i.description || ''));

  const price = el('div', 'price');
  if (effectivePrice(i) < Number(i.price)) price.appendChild(el('s', '', i.price));
  price.appendChild(document.createTextNode(i.discountedPrice != null ? i.discountedPrice : i.price));
  c.appendChild(price);
  if (i.discounts && i.discounts.length) c.appendChild(el('div', 'deal', discountText(i.discounts)));

  c.appendChild(el('div', 'stock' + (out ? ' none' : ''), out ? 'Out of stock' : i.availableStock + ' in stock'));

  const buy = el('div', 'buy');
  const qty = document.createElement('input');
  qty.type = 'number';
  qty.min = 1;
  qty.value = 1;
  qty.disabled = out;
  const btn = el('button', '', 'Add to cart');
  btn.type = 'button';
  btn.disabled = out;
  btn.onclick = () => addToCart(i, qty);
  buy.appendChild(qty);
  buy.appendChild(btn);
  c.appendChild(buy);
  return c;
}

async function addToCart(item, qtyInput) {
  const quantity = Math.max(1, parseInt(qtyInput.value, 10) || 1);
  const r = await send('POST', cust('/cart/items'), { itemId: item.id, quantity });
  if (r.ok) {
    notify('Added ' + quantity + ' x ' + item.name + ' to your cart.', false);
    refreshCartCount();
  } else {
    notify(errorMessage(r), true);
  }
}

$('base').onchange = load;
load();
</script>
</body>
</html>
