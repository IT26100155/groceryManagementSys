<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Update Audit Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📜 Inventory Update Audit Log</h2>
        <a th:href="@{/api/inventory/items}" class="btn btn-outline-primary">Back to Items</a>
    </div>
    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-striped align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Log ID</th>
                <th>Date & Time</th>
                <th>Item Name</th>
                <th>Employee ID</th>
                <th>Quantity Change</th>
                <th>Reason</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.id}"></td>
                <td th:text="${#temporals.format(log.date, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${log.itemName}"></td>
                <td th:text="${log.employeeId}"></td>
                <td>
                        <span th:class="${log.amount > 0 ? 'text-success fw-bold' : 'text-danger fw-bold'}"
                              th:text="${log.amount > 0 ? '+' + log.amount : log.amount}">
                        </span>
                </td>
                <td>
                    <span class="badge bg-secondary" th:text="${log.reason}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="6" class="text-center py-4 text-muted">No inventory updates logged yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
