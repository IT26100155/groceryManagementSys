<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Perishable Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add Perishable Grocery Item</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/api/inventory/add-perishable}" th:object="${itemDTO}" method="post">
                <div class="mb-3">
                    <label class="form-label">Item Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g., Fresh Milk 1L">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select th:field="*{categoryId}" class="form-select">
                        <option value="">-- Select Category --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Brand / Supplier</label>
                    <input type="text" th:field="*{brandSupplier}" class="form-control" placeholder="e.g., Anchor">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Price ($)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" required placeholder="2.99">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Initial Stock</label>
                        <input type="number" th:field="*{availableStock}" class="form-control" required placeholder="60">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Storage Requirement</label>
                    <input type="text" th:field="*{storageRequirement}" class="form-control" placeholder="e.g., Cold Storage">
                </div>
                <div class="mb-3">
                    <label class="form-label">Expiration Date</label>
                    <input type="date" th:field="*{expirationDate}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/item.jpg">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/api/inventory/items}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
